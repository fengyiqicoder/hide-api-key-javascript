<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>My AI page</title></head>
<body>
  <h1>Ask my AI</h1>
  <button id="go">Ask</button>
  <p id="out"></p>

  <script>
    const API_KEY = "sk-live-4f9a2c7e1b8d6f3a0e5c9b2d7a1f4e8c";   // anyone can read this

    document.getElementById("go").onclick = async () => {
      const res = await fetch("https://api.example-ai.com/v1/chat", {
        method: "POST",
        headers: { "Authorization": "Bearer " + API_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: "Say hello" }),
      });
      document.getElementById("out").textContent = (await res.json()).text;
    };
  </script>
</body>
</html>
